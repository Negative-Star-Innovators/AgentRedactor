name: Build Linux

# Linux CI builds the core + engine + Qt GUI on Ubuntu (x64 and arm64), runs
# the cross-platform and Linux suites, and packs final-version candidates on
# main. Tags and manual publish dispatches promote the exact tested candidate
# to R2 (channels linux/linux-arm64); PRs and non-publish dispatches are dry-runs.
#
# The changes job selects affected platforms. Docs-only and unrelated-platform
# changes skip the expensive build/test/pack steps (see RUN_BUILD below).
# The gate is deliberately on the STEPS, not the job: a skipped matrix job
# reports a single "build" check, which does not satisfy the required per-arch
# checks ("build (x64)"/"build (arm64)") — a job whose steps all skip reports
# success under the real leg names. (Trigger-level paths-ignore is worse
# still: no check runs at all, so required checks block merging.)
on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Defaults to windows/version.txt.'
        required: false
        type: string
      candidate_run_id:
        description: 'Successful main candidate run to publish (required when publish is checked).'
        required: false
        type: string
      publish:
        description: 'Promote an existing tested candidate to R2 without rebuilding. Off = dry-run.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Gate job: decides whether the diff contains anything but docs. Cheap
  # (ubuntu, seconds); the build job below keys off its output.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      linux: ${{ steps.diff.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            BASE="${{ github.event.before }}"
          fi
          python3 scripts/ci_platform_changes.py --base "$BASE"

  build:
    needs: changes
    strategy:
      # One arch failing must not cancel the other; publish only runs when
      # both succeed anyway (same pattern as release-selfrelease.yml).
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Native runners per arch, same pattern as the Windows ARM64 leg.
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    env:
      ONNXRUNTIME_DIR: ${{ github.workspace }}/onnxruntime
      # Candidate, PR, and dry-run builds only execute for affected platforms.
      # Skipped steps still report success under the per-arch required names.
      RUN_BUILD: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') || (github.event_name == 'workflow_dispatch' && !inputs.publish)) && needs.changes.outputs.linux == 'true' }}
    steps:
      - name: Checkout
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@v4

      - name: Resolve version from version.txt
        if: env.RUN_BUILD == 'true'
        run: |
          version=$(tr -d '[:space:]' < windows/version.txt)
          echo "VERSION_FROM_VERSION_TXT=$version" >> "$GITHUB_ENV"
          echo "Building version $version"

      - name: Install build + test dependencies
        if: env.RUN_BUILD == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libsecret-1-dev libcurl4-openssl-dev libssl-dev nlohmann-json3-dev \
            qt6-base-dev qt6-l10n-tools libgl1-mesa-dev fuse libfuse2t64 \
            xvfb python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 patchelf

      # onnxruntime has no apt package; official tarball per arch, same as
      # linux/README.md documents for local builds.
      - name: Download onnxruntime
        if: env.RUN_BUILD == 'true'
        run: |
          mkdir -p "$ONNXRUNTIME_DIR"
          rid="${{ matrix.arch == 'x64' && 'x64' || 'aarch64' }}"
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-${rid}-1.29.0.tgz" \
            | tar xz -C "$ONNXRUNTIME_DIR" --strip-components=1

      - name: Set up Python
        if: env.RUN_BUILD == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: env.RUN_BUILD == 'true'
        run: pip install -r tests/requirements.txt

      # The engine refuses to serve (proxy ports stay closed) until the NER
      # model weights exist, and the CLI/linux suites spawn the real engine —
      # so the ~1.6 GB weights must be present. Companions come from the repo
      # checkout (windows/models/, same files the Windows build ships); only
      # the gitignored weights are downloaded, from the same R2 models
      # endpoint the app itself uses. Cached across runs.
      - name: Cache ONNX model weights
        if: env.RUN_BUILD == 'true'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/agentredactor/models
          key: onnx-model-ner-${{ runner.arch }}-v1

      - name: Stage model files (cache miss only)
        if: env.RUN_BUILD == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          dest=~/.local/share/agentredactor/models
          mkdir -p "$dest/onnx"
          cp windows/models/config.json windows/models/tokenizer.json \
            windows/models/viterbi_calibration.json "$dest/"
          cp windows/models/onnx/model_quantized.onnx "$dest/onnx/"
          curl -fL --retry 3 -o "$dest/onnx/model_quantized.onnx_data" \
            https://api.agentredactor.negativestarinnovators.com/models/model_quantized.onnx_data

      - name: Build (dev config, updater off)
        if: env.RUN_BUILD == 'true'
        run: |
          cmake -S linux -B linux/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNXRUNTIME_INCLUDE_DIR="$ONNXRUNTIME_DIR/include" \
            -DONNXRUNTIME_LIB="$ONNXRUNTIME_DIR/lib/libonnxruntime.so"
          cmake --build linux/build

      # The three suites must each run in their own pytest process: tests/cli
      # and tests/migration both ship a top-level conftest.py and a shared
      # module name breaks a combined run.
      - name: Run CLI tests
        if: env.RUN_BUILD == 'true'
        run: python -m pytest tests/cli -q

      - name: Run migration tests
        if: env.RUN_BUILD == 'true'
        run: python -m pytest tests/migration -q

      - name: Run Linux tests (offscreen GUI smoke)
        if: env.RUN_BUILD == 'true'
        run: python -m pytest tests/linux -q -m "not atspi"

      # The AT-SPI suite (tests/linux/test_gui_atspi.py) drives the real GUI
      # through the accessibility bus: Qt only registers there under
      # QT_QPA_PLATFORM=xcb, so it needs a display (Xvfb) and a D-Bus session
      # for the a11y bus. The gi/Atspi bindings come from the distro packages
      # above; PYTHONPATH exposes them to the setup-python interpreter.
      - name: Run Linux GUI tests (AT-SPI, Xvfb)
        if: env.RUN_BUILD == 'true'
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            python -m pytest tests/linux/test_gui_atspi.py -q

      # On AT-SPI failures upload the per-test GUI logs and the accessibility
      # tree dumps the driver writes on lookup timeouts.
      - name: Upload AT-SPI failure diagnostics
        if: env.RUN_BUILD == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-diagnostics-${{ matrix.arch }}
          path: |
            /tmp/pytest-of-runner/**/gui_atspi.log
            /tmp/pytest-of-runner/**/atspi_tree_dump.txt
            /tmp/pytest-of-runner/**/config/agent_redactor.log
            /tmp/pytest-of-runner/**/config/settings.json
          retention-days: 14

      - name: Set up .NET (for vpk)
        if: env.RUN_BUILD == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Pinned to the Velopack library version vendored by
      # linux/fetch-velopack.sh — keep the two in sync.
      - name: Install vpk 1.2.0 (Velopack CLI)
        if: env.RUN_BUILD == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      # build-release.sh derives the vpk runtime/channel from the host arch
      # (linux-x64/'linux', linux-arm64/'linux-arm64').
      - name: Build and pack AppImage (build-release.sh)
        if: env.RUN_BUILD == 'true'
        env:
          ONNXRUNTIME_INCLUDE_DIR: ${{ github.workspace }}/onnxruntime/include
          ONNXRUNTIME_LIB: ${{ github.workspace }}/onnxruntime/lib/libonnxruntime.so
        run: linux/build-release.sh

      - name: Verify Velopack output
        if: env.RUN_BUILD == 'true'
        run: |
          dir=linux/build-release/velopack
          channel="${{ matrix.arch == 'x64' && 'linux' || 'linux-arm64' }}"
          test -f "$dir/releases.${channel}.json" || { echo "missing releases.${channel}.json"; exit 1; }
          ls "$dir"/*-full.nupkg >/dev/null || { echo "no full nupkg"; exit 1; }
          ls "$dir"/*.AppImage >/dev/null || { echo "no AppImage"; exit 1; }
          echo "Velopack output OK:" && ls "$dir"

      # The xcb platform plugin must resolve every dependency from the AppDir
      # or the host. A missing libxcb-* extension lib means the GUI core-dumps
      # on slim distros (WSLg sets DISPLAY but lacks the libs) - catch that at
      # build time. The staged AppDir is the packed content, so checking it
      # covers the shipped AppImage.
      - name: Verify xcb platform plugin dependencies
        if: env.RUN_BUILD == 'true'
        run: |
          plugin=linux/build-release/appdir/plugins/platforms/libqxcb.so
          test -f "$plugin" || { echo "xcb plugin missing from AppDir"; exit 1; }
          missing="$(ldd "$plugin" | awk '/not found/{print $1}')"
          if [ -n "$missing" ]; then
            echo "Unresolved xcb plugin dependencies (would break the GUI on slim distros):"
            echo "$missing"
            exit 1
          fi
          echo "xcb plugin dependencies OK"

      - name: Upload Velopack output artifact
        if: always() && env.RUN_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-velopack-linux-${{ matrix.arch }}
          path: linux/build-release/velopack
          retention-days: 30

      # Full self-update cycle against a loopback feed: packs a vNext release
      # from the staged AppDir and asserts the shipped AppImage swaps itself.
      # Runs after packing since it consumes the pack output; skips locally
      # when vpk or the pack output is missing.
      - name: Run update E2E (AppImage self-update)
        if: env.RUN_BUILD == 'true'
        run: python -m pytest tests/linux/test_update_feed.py -q

      # Grab the previous LIVE release's AppImage from R2 for the upgrade E2E.
      # The fixed-name AppImage at the channel root is always the latest live
      # build. Skipped gracefully when the channel has no live release yet, or
      # when the live version is not older than this build's version.
      - name: Download previous live AppImage from R2
        if: env.RUN_BUILD == 'true'
        id: prevappimage
        run: |
          channel="${{ matrix.arch == 'x64' && 'linux' || 'linux-arm64' }}"
          appimage="AgentRedactor.AppImage"
          if [ "$channel" = "linux-arm64" ]; then
            appimage="AgentRedactor-linux-arm64.AppImage"
          fi
          base="https://api.agentredactor.negativestarinnovators.com/updates/$channel"
          expected="${{ env.VERSION_FROM_VERSION_TXT }}"

          feed=$(curl -fsSL "$base/releases.$channel.json" 2>/dev/null || true)
          if [ -z "$feed" ]; then
            echo "::warning::No live release on channel '$channel' yet; skipping upgrade E2E"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > /tmp/resolve_prev.py <<'PY'
          import sys, json
          def parse(v):
              return tuple(int(x) for x in v.lstrip('vV').split('-')[0].split('+')[0].split('.'))
          expected = sys.argv[1]
          assets = [a for a in json.load(sys.stdin).get('Assets', [])
                    if a.get('Version') and str(a.get('Type')) in ('1', 'Full')]
          if not assets:
              print('__NO_ASSETS__')
              sys.exit(0)
          latest = max(assets, key=lambda a: parse(a['Version']))['Version']
          if parse(expected) > parse(latest):
              print('__OK__', latest)
          else:
              print('__SKIP__', latest)
          PY

          result=$(echo "$feed" | python3 /tmp/resolve_prev.py "$expected")
          case "$result" in
            __NO_ASSETS__)
              echo "::warning::No full-package asset on channel '$channel'; skipping upgrade E2E"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            __SKIP__*)
              latest=${result#__SKIP__ }
              echo "::warning::Live version $latest is not older than this build ($expected); skipping upgrade E2E"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            __OK__*)
              latest=${result#__OK__ }
              ;;
            *)
              echo "Unexpected feed resolver result: $result"
              exit 1
              ;;
          esac
          echo "Latest live version on '$channel': $latest (this build: $expected)"
          mkdir -p prev-appimage
          curl -fL --fail -o "prev-appimage/$appimage" "$base/$appimage"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "appimage_path=$(pwd)/prev-appimage/$appimage" >> "$GITHUB_OUTPUT"

      - name: Upgrade E2E (previous live release -> this build)
        if: env.RUN_BUILD == 'true' && steps.prevappimage.outputs.found == 'true'
        env:
          AGENTREDACTOR_UPGRADE_TEST: "1"
          AGENTREDACTOR_CHANNEL: ${{ matrix.arch == 'x64' && 'linux' || 'linux-arm64' }}
          AGENTREDACTOR_PREV_APPIMAGE: ${{ steps.prevappimage.outputs.appimage_path }}
          AGENTREDACTOR_FEED_DIR: ${{ github.workspace }}/linux/build-release/velopack
          AGENTREDACTOR_EXPECT_VERSION: ${{ env.VERSION_FROM_VERSION_TXT }}
        run: python -m pytest tests/linux/test_update_from_live.py -q

  # Publication reuses one successful main candidate containing both arches.
  # Tags resolve it by commit; manual publication supplies its run ID.
  publish:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || inputs.publish
    env:
      EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          expected="${EXPECTED_VERSION#v}"
          if [ -z "$expected" ]; then
            expected="$(tr -d '[:space:]' < windows/version.txt)"
          fi
          if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected version '$expected' is not valid semver."
            exit 1
          fi
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      - name: Resolve tested main candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build-linux.yml --commit "${GITHUB_SHA}" --branch main --event push --status success --limit 20 --json databaseId | jq -er '.[0].databaseId')"
          else
            run_id="${INPUT_RUN_ID}"
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::A successful main candidate_run_id is required."
            exit 1
          fi
          gh run view "$run_id" --repo "${GITHUB_REPOSITORY}" --json databaseId,headSha,headBranch,event,status,conclusion,workflowName,url > candidate-run.json
          jq -e '.headBranch == "main" and .event == "push" and .status == "completed" and .conclusion == "success" and .workflowName == "Build Linux"' candidate-run.json >/dev/null
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            jq -e --arg commit "${GITHUB_SHA}" '.headSha == $commit' candidate-run.json >/dev/null
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Promoting tested candidate: $(jq -r .url candidate-run.json)"

      - name: Download tested candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgentRedactor-velopack-linux-*
          path: velopack-linux
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate versions and packages
        run: |
          set -euo pipefail
          python3 - "${{ steps.ver.outputs.version }}" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[1]
          for arch, channel in (("x64", "linux"), ("arm64", "linux-arm64")):
              directory = pathlib.Path(f"velopack-linux/AgentRedactor-velopack-linux-{arch}")
              feed = json.loads((directory / f"releases.{channel}.json").read_text())
              full = [a for a in feed.get("Assets", []) if str(a.get("Type")) in ("1", "Full")]
              versions = [str(a.get("Version", "")).lstrip("vV") for a in full]
              if expected not in versions:
                  raise SystemExit(f"Candidate {channel} feed does not contain {expected}")
              if not list(directory.glob("*.AppImage")):
                  raise SystemExit(f"Candidate {channel} has no AppImage")
          PY

      - name: Set up .NET (for vpk)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk 1.2.0 (Velopack CLI)
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Check R2 secrets are configured
        run: |
          missing=""
          if [ -z '${{ secrets.R2_ACCOUNT_ID }}' ]; then missing="$missing R2_ACCOUNT_ID"; fi
          if [ -z '${{ secrets.R2_ACCESS_KEY_ID }}' ]; then missing="$missing R2_ACCESS_KEY_ID"; fi
          if [ -z '${{ secrets.R2_SECRET_ACCESS_KEY }}' ]; then missing="$missing R2_SECRET_ACCESS_KEY"; fi
          if [ -n "$missing" ]; then echo "Missing repo secrets:$missing"; exit 1; fi

      # Publishes the linux channel (releases.linux.json + nupkg + AppImage)
      # to R2 so installed Linux x64 instances can auto-update. vpk rejects
      # --region together with --endpoint (custom endpoint implies it).
      - name: Publish linux (x64) channel to R2
        run: vpk upload s3 --bucket agentredactor-releases --endpoint https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -c linux --prefix linux --outputDir velopack-linux/AgentRedactor-velopack-linux-x64

      # Same for the linux-arm64 channel (prefix linux-arm64/).
      - name: Publish linux-arm64 channel to R2
        run: vpk upload s3 --bucket agentredactor-releases --endpoint https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -c linux-arm64 --prefix linux-arm64 --outputDir velopack-linux/AgentRedactor-velopack-linux-arm64

      # vpk uploads its own bookkeeping files no client ever downloads
      # (assets.*.json upload manifest, legacy RELEASES file); keep the bucket
      # to client files only.
      - name: Remove non-client files from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for channel in linux linux-arm64; do
            aws s3 rm "s3://agentredactor-releases/${channel}/" \
              --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              --region auto --recursive --exclude "*" --include "assets.*.json" --include "RELEASES*"
          done
