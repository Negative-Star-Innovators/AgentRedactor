name: Tests

# The tests drive the real application UI with FlaUI, so they need an
# interactive Windows desktop session. There are two variants of the GUI test
# job (both run only the tests in tests/gui/; the third-party integration
# tests in third_party_tests/ are run locally, not in CI):
#
#   gui-tests-hosted    GitHub-hosted windows-latest (x64). Hosted Windows
#                       runners auto-logon to an interactive desktop session,
#                       so UI automation generally works there. Free for
#                       public repos. Does NOT compile the app: it downloads
#                       the AgentRedactor-release-bin artifact from the latest
#                       successful Build MSIX run on main, so that workflow
#                       must have run at least once.
#   gui-tests-hosted-arm64
#                       Same as gui-tests-hosted but on the windows-11-arm
#                       ARM64 runner, using the AgentRedactor-release-bin-arm64
#                       artifact from the same Build MSIX run.
#   gui-tests           Self-hosted Windows runner logged in to an interactive
#                       session. Kept as a fallback in case the hosted job
#                       turns out to be flaky for this app.
#
# Trigger manually with: Actions -> Tests -> Run workflow.

on:
  workflow_dispatch:

jobs:
  gui-tests-hosted:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      # Reuse the Release binaries built by the Build MSIX workflow instead of
      # compiling here (vcpkg + msbuild was the bulk of this job's runtime).
      - name: Find latest successful Build MSIX run
        id: msix
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $id = gh run list -R ${{ github.repository }} --workflow build-msix.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) { throw "No successful Build MSIX run found on main; run that workflow first." }
          echo "run_id=$id" >> $env:GITHUB_OUTPUT

      - name: Download prebuilt AgentRedactor binaries
        uses: actions/download-artifact@v4
        with:
          name: AgentRedactor-release-bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.msix.outputs.run_id }}
          path: repo/AgentRedactor/build/x64/Release

      # The ONNX weights are ~1.6 GB; cache them across runs. Bump v1 to
      # invalidate. Restored cache makes the download step below a no-op.
      - name: Cache ONNX model weights
        uses: actions/cache@v4
        with:
          path: repo/AgentRedactor/models/onnx
          key: onnx-models-v1

      - name: Download ONNX model weights
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path repo/AgentRedactor/models/onnx/model_quantized.onnx_data)) {
            gh release download models-v1 -R ${{ github.repository }} --pattern model_quantized.onnx_data --dir repo/AgentRedactor/models/onnx --clobber
          }

      # The binaries artifact excludes models/; copy the cached model in.
      - name: Restore ONNX model into build output
        shell: pwsh
        run: |
          robocopy repo/AgentRedactor/models repo/AgentRedactor/build/x64/Release/models /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Build FlaUI helper
        shell: pwsh
        run: repo/tests/gui/windows/build.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: pip install -r repo/tests/requirements.txt

      - name: Run GUI tests
        shell: pwsh
        run: |
          cd repo/tests
          pytest -v gui/

  gui-tests-hosted-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      # Reuse the ARM64 Release binaries built by the Build MSIX workflow
      # instead of compiling here.
      - name: Find latest successful Build MSIX run
        id: msix
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $id = gh run list -R ${{ github.repository }} --workflow build-msix.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) { throw "No successful Build MSIX run found on main; run that workflow first." }
          echo "run_id=$id" >> $env:GITHUB_OUTPUT

      - name: Download prebuilt AgentRedactor binaries (arm64)
        uses: actions/download-artifact@v4
        with:
          name: AgentRedactor-release-bin-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.msix.outputs.run_id }}
          path: repo/AgentRedactor/build/ARM64/Release

      # The ONNX weights are ~1.6 GB; cache them across runs. Arch-neutral
      # file, so this shares the cache key with the x64 job.
      - name: Cache ONNX model weights
        uses: actions/cache@v4
        with:
          path: repo/AgentRedactor/models/onnx
          key: onnx-models-v1

      - name: Download ONNX model weights
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path repo/AgentRedactor/models/onnx/model_quantized.onnx_data)) {
            gh release download models-v1 -R ${{ github.repository }} --pattern model_quantized.onnx_data --dir repo/AgentRedactor/models/onnx --clobber
          }

      # The binaries artifact excludes models/; copy the cached model in.
      - name: Restore ONNX model into build output
        shell: pwsh
        run: |
          robocopy repo/AgentRedactor/models repo/AgentRedactor/build/ARM64/Release/models /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Build FlaUI helper
        shell: pwsh
        run: repo/tests/gui/windows/build.ps1

      # The Windows 11 client image shows a modal Windows Firewall prompt the
      # first time the app binds its proxy port ("Windows Firewall has blocked
      # some features of agentredactor..."). It steals foreground for the
      # whole run and breaks UI automation. Loopback is what the tests use,
      # so just disable the firewall for the duration of the job.
      - name: Disable Windows Firewall prompts
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

      # The app process dies on this runner during the master-password tests
      # with a 'Windows Security' window in the foreground. Capture Windows
      # Error Reporting mini-dumps so we can see whether it crashes or is
      # killed by Defender/Smart App Control.
      - name: Enable crash dump collection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\AgentRedactor.exe"
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps"
          Set-ItemProperty -Path $k -Name DumpCount -Value 5
          Set-ItemProperty -Path $k -Name DumpType -Value 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: pip install -r repo/tests/requirements.txt

      - name: Run GUI tests
        shell: pwsh
        run: |
          cd repo/tests
          pytest -v gui/

      - name: Show crash event-log entries
        if: always()
        shell: pwsh
        run: |
          foreach ($provider in @('Application Error', 'Windows Error Reporting')) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName=$provider} -MaxEvents 50 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'AgentRedactor' } |
              ForEach-Object { $_.TimeCreated; $_.Message; '---' }
          }
          Get-ChildItem C:\dumps -ErrorAction SilentlyContinue | Format-List Name, Length, LastWriteTime

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-crash-dumps
          path: C:\dumps
          if-no-files-found: ignore
          retention-days: 7

  gui-tests:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone vcpkg
        shell: pwsh
        run: if (-not (Test-Path vcpkg)) { git clone https://github.com/microsoft/vcpkg vcpkg }

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg\vcpkg.exe)) { vcpkg\bootstrap-vcpkg.bat -disableMetrics }
          vcpkg\vcpkg install onnxruntime:x64-windows nlohmann-json:x64-windows wil:x64-windows

      - name: Download ONNX model weights
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download models-v1 -R ${{ github.repository }} --pattern model_quantized.onnx_data --dir repo/AgentRedactor/models/onnx --clobber

      - name: Build app (buildquick.ps1)
        shell: pwsh
        run: repo/AgentRedactor/buildquick.ps1 -Configuration Release

      - name: Build FlaUI helper
        shell: pwsh
        run: repo/tests/gui/windows/build.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: pip install -r repo/tests/requirements.txt

      - name: Run GUI tests
        shell: pwsh
        run: |
          cd repo/tests
          pytest -v gui/
