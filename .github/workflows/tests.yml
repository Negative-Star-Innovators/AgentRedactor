name: Tests

# The tests drive the real application UI with FlaUI, so they need an
# interactive Windows desktop session. The hosted jobs call the reusable
# workflow in tests-gui.yml (same one the Self-Release pipeline uses to gate
# publishing):
#
#   gui-tests-hosted / gui-tests-hosted-arm64
#                       GitHub-hosted runners (windows-latest / windows-11-arm;
#                       hosted Windows runners auto-logon to an interactive
#                       desktop session, so UI automation works there). They
#                       test the AgentRedactor-release-bin[-arm64] artifact
#                       from the latest successful Build MSIX run on the SAME
#                       branch this workflow was dispatched on (Build MSIX runs
#                       automatically on every PR, so opening a PR produces
#                       the artifacts; wait for it to finish first).
#   gui-tests           Self-hosted Windows runner logged in to an interactive
#                       session. Kept as a fallback in case the hosted job
#                       turns out to be flaky for this app.
#
# The third-party integration tests in third_party_tests/ are run locally,
# not in CI. Trigger manually with: Actions -> Tests -> Run workflow.

on:
  workflow_dispatch:

jobs:
  # Find the Build MSIX run on THIS branch (github.ref_name), so a run
  # dispatched on a PR branch tests that branch's binaries, not main's.
  resolve-msix-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.msix.outputs.run_id }}
    steps:
      - name: Find latest successful Build MSIX run
        id: msix
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = "${{ github.ref_name }}"
          $id = gh run list -R ${{ github.repository }} --workflow build-msix.yml --branch $branch --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) { throw "No successful Build MSIX run found on branch '$branch'. Opening a PR triggers one automatically — wait for it to finish, then re-run this workflow on the same branch." }
          echo "run_id=$id" >> $env:GITHUB_OUTPUT

  # Job names MUST stay gui-tests-hosted / gui-tests-hosted-arm64: branch
  # protection requires checks under exactly these names (they report when
  # this workflow is dispatched on the PR branch).
  gui-tests-hosted:
    needs: resolve-msix-run
    uses: ./.github/workflows/tests-gui.yml
    with:
      arch: x64
      artifact: AgentRedactor-release-bin
      run-id: ${{ needs.resolve-msix-run.outputs.run_id }}
      run-migration: true

  gui-tests-hosted-arm64:
    needs: resolve-msix-run
    uses: ./.github/workflows/tests-gui.yml
    with:
      arch: arm64
      artifact: AgentRedactor-release-bin-arm64
      run-id: ${{ needs.resolve-msix-run.outputs.run_id }}

  gui-tests:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone vcpkg
        shell: pwsh
        run: if (-not (Test-Path vcpkg)) { git clone https://github.com/microsoft/vcpkg vcpkg }

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg\vcpkg.exe)) { vcpkg\bootstrap-vcpkg.bat -disableMetrics }
          vcpkg\vcpkg install onnxruntime:x64-windows nlohmann-json:x64-windows wil:x64-windows

      - name: Download ONNX model weights
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download models-v1 -R ${{ github.repository }} --pattern model_quantized.onnx_data --dir repo/AgentRedactor/models/onnx --clobber

      - name: Build app (buildquick.ps1)
        shell: pwsh
        run: repo/AgentRedactor/buildquick.ps1 -Configuration Release

      - name: Build FlaUI helper
        shell: pwsh
        run: repo/tests/gui/windows/build.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: pip install -r repo/tests/requirements.txt

      - name: Run GUI tests
        shell: pwsh
        run: |
          cd repo/tests
          pytest -v gui/
