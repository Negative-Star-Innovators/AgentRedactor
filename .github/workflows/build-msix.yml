name: Build MSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to publish the MSIX to the rolling "latest" release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The vcxproj references vcpkg at ..\..\vcpkg relative to itself, so the
      # repo is checked out into a subfolder and vcpkg sits next to it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone vcpkg
        shell: pwsh
        run: git clone https://github.com/microsoft/vcpkg vcpkg

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: vcpkg-${{ hashFiles('repo/AgentRedactor/vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Install vcpkg dependencies (first run is slow, then cached)
        shell: pwsh
        run: |
          vcpkg\bootstrap-vcpkg.bat -disableMetrics
          vcpkg\vcpkg install onnxruntime:x64-windows nlohmann-json:x64-windows wil:x64-windows

      # The 1.6 GB model weights are not in the repo; they are a release asset
      # (see README). Skipped automatically on forks/PRs without access.
      - name: Download ONNX model weights
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download models-v1 --pattern model_quantized.onnx_data --dir repo/AgentRedactor/models/onnx --clobber

      - name: Build MSIX (build.ps1)
        shell: pwsh
        run: repo/AgentRedactor/build.ps1

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-msix
          path: repo/AgentRedactor/build/AgentRedactor.msix
          retention-days: 30

      # Upload the unpackaged Release build so the gui-tests-hosted job can
      # reuse it instead of compiling again. (The MSIX itself is unsuitable
      # for the tests: installing it virtualizes AppData, which the tests
      # depend on.) models/ (1.6 GB, cached separately in the test job),
      # obj/ (build intermediates) and the .pdb are excluded.
      - name: Upload Release binaries artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-release-bin
          path: |
            repo/AgentRedactor/build/x64/Release
            !repo/AgentRedactor/build/x64/Release/models
            !repo/AgentRedactor/build/x64/Release/obj
            !repo/AgentRedactor/build/x64/Release/*.pdb
          compression-level: 0
          retention-days: 7

      # Publish the MSIX to a rolling "latest" prerelease so anyone can
      # download the most recent build from the Releases page. Runs only on
      # pushes to main (not PRs, which may come from forks without secrets).
      - name: Publish MSIX to latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: repo/AgentRedactor/build/AgentRedactor.msix
