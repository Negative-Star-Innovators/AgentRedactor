name: Build MSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Docs-only changes (markdown, website/, docs/) skip the heavy build jobs via
# the `changes` gate job below. Skipped jobs report a passing result to
# required status checks, unlike paths/paths-ignore filters, which leave
# required checks pending forever and block merging.

# Rapid pushes to the same PR/branch cancel the superseded build — only the
# latest commit's artifacts matter (the Tests workflow consumes them).
concurrency:
  group: build-msix-${{ github.ref }}
  cancel-in-progress: true

# Needed to publish the MSIX bundle to the rolling "latest" release.
permissions:
  contents: write

jobs:
  # Gate job: decides whether the diff contains anything but docs. Cheap
  # (ubuntu, seconds); the Windows build jobs below key off its output.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            # No parent to diff against (e.g. first push) — build.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^website/|^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Build each architecture natively: x64 on windows-latest, ARM64 on the
    # free ARM64 hosted runner (public preview, free for public repos).
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}
    steps:
      # The vcxproj references vcpkg at ..\..\vcpkg relative to itself, so the
      # repo is checked out into a subfolder and vcpkg sits next to it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone vcpkg
        shell: pwsh
        run: git clone https://github.com/microsoft/vcpkg vcpkg

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('repo/AgentRedactor/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-

      - name: Install vcpkg dependencies (first run per arch is slow, then cached)
        shell: pwsh
        run: |
          # The bootstrap download of vcpkg.exe itself occasionally times out
          # on the hosted runners (seen on windows-11-arm) — retry a few times.
          foreach ($attempt in 1..3) {
            vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) {
              vcpkg\vcpkg install onnxruntime:${{ matrix.arch }}-windows nlohmann-json:${{ matrix.arch }}-windows wil:${{ matrix.arch }}-windows
              if ($LASTEXITCODE -eq 0) { break }
            }
            Write-Host "vcpkg attempt $attempt failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap/install failed after 3 attempts' }

      # The 1.6 GB model weights are not in the repo; they are served from the
      # Cloudflare R2 bucket via the api worker (see cloudflare/README.md).
      - name: Download ONNX model weights
        shell: pwsh
        run: curl.exe -L --fail -o repo/AgentRedactor/models/onnx/model_quantized.onnx_data https://api.agentredactor.negativestarinnovators.com/models/model_quantized.onnx_data

      - name: Build MSIX (build.ps1)
        shell: pwsh
        run: repo/AgentRedactor/build.ps1 -Platform ${{ matrix.arch }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-msix-${{ matrix.arch }}
          path: repo/AgentRedactor/build/AgentRedactor-${{ matrix.arch }}.msix
          retention-days: 30

      # Upload the unpackaged Release build so the GUI test jobs can reuse it
      # instead of compiling again. (The MSIX itself is unsuitable for the
      # tests: installing it virtualizes AppData, which the tests depend on.)
      # models/ (1.6 GB, cached separately in the test job), obj/ (build
      # intermediates) and the .pdb are excluded. The x64 artifact keeps the
      # original AgentRedactor-release-bin name for compatibility.
      - name: Upload Release binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'x64' && 'AgentRedactor-release-bin' || 'AgentRedactor-release-bin-arm64' }}
          path: |
            repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/models
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/obj
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/*.pdb
          compression-level: 0
          retention-days: 7

  # Smoke-test the packaged MSIX itself: self-sign it (the runner is
  # ephemeral, so a throwaway cert + TrustedPeople import is fine), install,
  # verify registration, launch, and uninstall. This catches manifest, asset,
  # publisher and capability regressions that the loose-binary GUI tests in
  # tests.yml structurally cannot see (installing the MSIX virtualizes
  # AppData, which is why those tests avoid it — here that doesn't matter,
  # we only assert install/register/launch).
  test-msix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}
    timeout-minutes: 20
    steps:
      # scripts/sign-agentredactor-msix.ps1 reads the Publisher from
      # AgentRedactor/Package.appxmanifest relative to the script, so the
      # checkout layout must keep scripts/ and AgentRedactor/ siblings.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentRedactor-msix-${{ matrix.arch }}
          path: msix

      # Allow sideloading of trusted apps (default on Win11 client, not
      # necessarily on the Server image).
      - name: Enable sideloading
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowAllTrustedApps -Value 1

      # Same Windows 11 client-image quirks as the GUI tests (tests-gui.yml):
      # a modal firewall prompt the first time the app binds its proxy port,
      # and the SCOOBE nag, can both block the packaged app's first launch.
      - name: Disable Windows Firewall prompts (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

      - name: Dismiss OOBE nag screens (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          New-Item -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\UserProfileEngagement" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\UserProfileEngagement" -Name ScoobeSystemSettingEnabled -Value 0
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE" -Name DisablePrivacyExperience -Value 1
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'CloudExperienceHost|UserOOBEBroker' } |
            Stop-Process -Force -ErrorAction SilentlyContinue

      # Creates a throwaway self-signed cert matching the manifest Publisher,
      # signs the MSIX, and trusts the cert (LocalMachine\TrustedPeople+Root)
      # so Add-AppxPackage accepts it.
      - name: Self-sign MSIX
        shell: pwsh
        run: |
          & repo/scripts/sign-agentredactor-msix.ps1 -MsixPath "msix/AgentRedactor-${{ matrix.arch }}.msix" -TrustCert

      - name: Install MSIX and verify registration
        shell: pwsh
        run: |
          Add-AppxPackage -Path "msix/AgentRedactor-${{ matrix.arch }}.msix" -ErrorAction Stop
          $pkg = Get-AppxPackage -Name '*AgentRedactor*'
          if (-not $pkg) { throw 'Package not registered after Add-AppxPackage' }
          Write-Host "Registered: $($pkg.PackageFullName) ($($pkg.Architecture))"
          $expectedArch = if ('${{ matrix.arch }}' -eq 'x64') { 'X64' } else { 'Arm64' }
          if ($pkg.Architecture -ne $expectedArch) { throw "Package architecture $($pkg.Architecture) != $expectedArch" }

      - name: Launch packaged app and verify process
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name '*AgentRedactor*'
          $appId = (Get-AppxPackageManifest $pkg).Package.Applications.Application.Id
          $aumid = "$($pkg.PackageFamilyName)!$appId"
          Write-Host "Activating $aumid"

          # Activate via IApplicationActivationManager instead of
          # `explorer.exe shell:AppsFolder...` — explorer silently swallows
          # activation failures (no process, no error), while this surfaces
          # the real HRESULT and the launched PID.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PackagedAppLauncher {
              [ComImport, Guid("2e941141-7f97-4756-ba1d-9decde894a3d"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              private interface IApplicationActivationManager {
                  int ActivateApplication([MarshalAs(UnmanagedType.LPWStr)] string appUserModelId, [MarshalAs(UnmanagedType.LPWStr)] string arguments, int options, out uint processId);
              }
              [ComImport, Guid("45BA127D-10A8-46EA-8AB7-56EA9078943C")]
              private class ApplicationActivationManager {}
              public static uint Launch(string aumid) {
                  var mgr = (IApplicationActivationManager)new ApplicationActivationManager();
                  uint pid;
                  int hr = mgr.ActivateApplication(aumid, null, 0, out pid);
                  if (hr != 0) Marshal.ThrowExceptionForHR(hr);
                  return pid;
              }
          }
          '@
          $launchedPid = [PackagedAppLauncher]::Launch($aumid)
          Write-Host "Activation returned PID $launchedPid; waiting for the process..."
          $deadline = (Get-Date).AddSeconds(180)
          $proc = $null
          while ((Get-Date) -lt $deadline -and -not $proc) {
            Start-Sleep -Seconds 3
            $proc = Get-Process -Name 'AgentRedactor' -ErrorAction SilentlyContinue
          }
          if (-not $proc) { throw "Packaged app did not start within 180s (activation PID was $launchedPid)" }
          Write-Host "Packaged app is running (PID $($proc[0].Id)); stopping it."
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue

      # If the launch above failed, the reason is usually in the Application
      # event log (crash, activation error) or the app's own log inside the
      # package state dir (LocalCache is the virtualized AppData).
      - name: Dump diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($provider in @('Application Error', 'Windows Error Reporting')) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName=$provider} -MaxEvents 20 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.TimeCreated; $_.Message; '---' }
          }
          Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object { $_.LevelDisplayName -in @('Error', 'Warning') } |
            ForEach-Object { $_.TimeCreated; $_.Message; '---' }
          $pkg = Get-AppxPackage -Name '*AgentRedactor*' -ErrorAction SilentlyContinue
          if ($pkg) {
            $pkg | Format-List Name, PackageFullName, Status, InstallLocation
            foreach ($root in @(
              (Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalCache"),
              (Join-Path $env:APPDATA 'AgentRedactor'))) {
              Get-ChildItem $root -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "== $($_.FullName) =="
                Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Uninstall and verify removal
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name 'AgentRedactor' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $pkg = Get-AppxPackage -Name '*AgentRedactor*'
          if ($pkg) {
            $pkg | Remove-AppxPackage -ErrorAction Stop
            if (Get-AppxPackage -Name '*AgentRedactor*') { throw 'Package still present after Remove-AppxPackage' }
            Write-Host 'Package uninstalled cleanly.'
          }

  release:
    needs: [build, test-msix]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download per-arch MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: AgentRedactor-msix-*
          path: msix
          merge-multiple: true

      # Remove the stale bundle asset from earlier releases (it exceeded
      # GitHub's 2 GB per-asset limit; we now publish per-arch MSIX files).
      - name: Delete old bundle asset if present
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset latest AgentRedactor.msixbundle -R ${{ github.repository }}

      # Publish both per-arch MSIX packages to the rolling "latest" prerelease.
      # (Each is ~1.8 GB, under GitHub's 2 GB per-asset limit; a combined
      # bundle would exceed it. Partner Center accepts both files in a single
      # Store submission and serves the right arch per device.)
      - name: Publish MSIX packages to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: msix/AgentRedactor-*.msix
