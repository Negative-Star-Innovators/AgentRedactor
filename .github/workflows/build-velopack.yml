name: Build Velopack

# CI counterpart of build-msix.yml for the self-release (Velopack) channel:
# builds both architectures on every PR/push and uploads the vpk output as
# artifacts, but never publishes anything. Publishing stays exclusively in
# release-selfrelease.yml (tag pushes / manual dispatch only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Rapid pushes to the same PR/branch cancel the superseded build — only the
# latest commit's artifacts matter.
concurrency:
  group: build-velopack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Build each architecture natively: x64 on windows-latest, ARM64 on the
    # free ARM64 hosted runner (public preview, free for public repos).
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}
    steps:
      # The vcxproj references vcpkg at ..\..\vcpkg relative to itself, so the
      # repo is checked out into a subfolder and vcpkg sits next to it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone vcpkg
        shell: pwsh
        run: git clone https://github.com/microsoft/vcpkg vcpkg

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('repo/AgentRedactor/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-

      - name: Install vcpkg dependencies (first run per arch is slow, then cached)
        shell: pwsh
        run: |
          vcpkg\bootstrap-vcpkg.bat -disableMetrics
          vcpkg\vcpkg install onnxruntime:${{ matrix.arch }}-windows nlohmann-json:${{ matrix.arch }}-windows wil:${{ matrix.arch }}-windows

      # NOTE: unlike build-msix.yml we intentionally do NOT download the 1.6 GB
      # ONNX weights — the self-release package excludes them and the app
      # downloads them on first run (ModelDownloader).

      - name: Install vpk (Velopack CLI)
        shell: pwsh
        run: dotnet tool install -g vpk

      # Builds Release for this arch with -p:SelfRelease=true and runs
      # `vpk pack` (version from version.txt). x64 packs channel 'win' into
      # build/velopack, ARM64 packs channel 'win-arm64' into
      # build/velopack-arm64 (see build.ps1).
      - name: Build and pack self-release (build-selfrelease.ps1)
        shell: pwsh
        run: repo/AgentRedactor/build-selfrelease.ps1 -Platform ${{ matrix.arch }}

      # Cheap sanity check that vpk produced a usable feed: the channel feed
      # file, a full nupkg and the Setup.exe must all be present. Catches
      # silent pack regressions without installing anything.
      - name: Verify Velopack output
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.arch }}' -eq 'x64') { 'repo/AgentRedactor/build/velopack' } else { 'repo/AgentRedactor/build/velopack-arm64' }
          $channel = if ('${{ matrix.arch }}' -eq 'x64') { 'win' } else { 'win-arm64' }
          $feed = Join-Path $dir "releases.$channel.json"
          if (-not (Test-Path $feed)) { throw "Missing feed file: $feed" }
          if (-not (Get-ChildItem $dir -Filter '*-full.nupkg')) { throw "No *-full.nupkg in $dir" }
          if (-not (Get-ChildItem $dir -Filter '*-Setup.exe')) { throw "No *-Setup.exe in $dir" }
          $json = Get-Content -Raw $feed | ConvertFrom-Json
          if (-not $json.Assets -or $json.Assets.Count -eq 0) { throw "$feed has no assets" }
          Write-Host "Velopack output OK: $($json.Assets.Count) asset(s) in releases.$channel.json"

      # Upload the raw vpk output per arch (Setup.exe + nupkg + feed json).
      # Named -ci- to distinguish them from the release workflow's
      # AgentRedactor-velopack-<version>-<arch> artifacts.
      - name: Upload Velopack output artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-velopack-ci-${{ matrix.arch }}
          path: repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'velopack' || 'velopack-arm64' }}
          retention-days: 30

      # Also upload the unpackaged SelfRelease build so test jobs (settings
      # migration, upgrade E2E on PRs) can reuse it instead of compiling
      # again. models/, obj/ and the .pdb are excluded, mirroring the
      # release-bin artifacts in build-msix.yml.
      - name: Upload SelfRelease binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'x64' && 'AgentRedactor-selfrelease-bin' || 'AgentRedactor-selfrelease-bin-arm64' }}
          path: |
            repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/models
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/obj
            !repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/*.pdb
          compression-level: 0
          retention-days: 7
