name: Self-Release (Velopack)

# Publishing is gated: updates are only ever published when the maintainer
# pushes a version tag (v*) or manually re-runs this workflow with publish
# checked. Pull requests run the same build + pack + tests as a dry-run
# (the publish job stays off for PRs — see its `if:`), so release problems
# surface before tagging.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0). Must match AgentRedactor/version.txt.'
        required: true
        type: string
      publish:
        description: 'Publish the GitHub release. Off = dry-run: full build + pack + tests, artifacts only.'
        required: false
        type: boolean
        default: false

# Rapid pushes to the same PR cancel the superseded run. Tag pushes get their
# own group per ref, so a release in flight is never cancelled.
concurrency:
  group: release-selfrelease-${{ github.ref }}
  cancel-in-progress: true

# Needed to create the GitHub release and upload Velopack release assets.
permissions:
  contents: write

jobs:
  release:
    strategy:
      # One arch failing must not cancel the other — a single-arch release is
      # still useful, and the publish job only runs when both succeed anyway.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Build each architecture natively, same runner pattern as build-msix.yml:
    # x64 on windows-latest, ARM64 on the free ARM64 hosted runner.
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}
    env:
      # Expected version: tag name on tag pushes, the version input on manual
      # re-runs. Empty on pull_request — the validate step below falls back to
      # version.txt (there is no tag to validate against on a PR).
      EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      # The vcxproj references vcpkg at ..\..\vcpkg relative to itself, so the
      # repo is checked out into a subfolder and vcpkg sits next to it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      # Fail early if the tag/input version doesn't match version.txt — the
      # build script reads the version from that file, so a mismatch would
      # publish an updater release stamped with the wrong version. On PRs
      # there is no tag/input to check; use version.txt as the version and
      # export it for the later steps (artifact names, upgrade E2E).
      - name: Resolve and validate version
        shell: pwsh
        run: |
          $fileVersion = (Get-Content -Raw repo/AgentRedactor/version.txt).Trim()
          $expected = $env:EXPECTED_VERSION.Trim().TrimStart('v', 'V')
          if (-not $expected) {
            # PR build: nothing to validate against — version.txt is the source.
            $expected = $fileVersion
            echo "EXPECTED_VERSION=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "PR build (no tag/input); version from version.txt: v$expected"
          }
          if ($expected -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Expected version '$expected' is not a valid semver (e.g. v1.1.0)."
            exit 1
          }
          if ($fileVersion -ne $expected) {
            Write-Error ("Version mismatch: tag/input is 'v{0}' but AgentRedactor/version.txt contains '{1}'. " +
              "Bump version.txt to '$expected' and re-tag (see scripts/new-release.ps1)." -f $expected, $fileVersion)
            exit 1
          }
          Write-Host "Version OK: v$expected"

      - name: Clone vcpkg
        shell: pwsh
        run: git clone https://github.com/microsoft/vcpkg vcpkg

      # Cache is arch-scoped (vcpkg-x64-* / vcpkg-arm64-*), same as
      # build-msix.yml — triplets differ per arch and must not share a cache.
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('repo/AgentRedactor/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-

      - name: Install vcpkg dependencies (first run per arch is slow, then cached)
        shell: pwsh
        run: |
          vcpkg\bootstrap-vcpkg.bat -disableMetrics
          vcpkg\vcpkg install onnxruntime:${{ matrix.arch }}-windows nlohmann-json:${{ matrix.arch }}-windows wil:${{ matrix.arch }}-windows

      # NOTE: unlike build-msix.yml we intentionally do NOT download the 1.6 GB
      # ONNX weights — the self-release package excludes them and the app
      # downloads them on first run (ModelDownloader).

      - name: Install vpk (Velopack CLI)
        shell: pwsh
        run: dotnet tool install -g vpk

      # Builds Release for this arch with -p:SelfRelease=true and runs
      # `vpk pack` (version from version.txt, already validated against the
      # tag above). x64 packs channel 'win' into build/velopack, ARM64 packs
      # channel 'win-arm64' into build/velopack-arm64 (see build.ps1).
      - name: Build and pack self-release (build-selfrelease.ps1)
        shell: pwsh
        run: repo/AgentRedactor/build-selfrelease.ps1 -Platform ${{ matrix.arch }}

      # Gate the publish on tests: settings-migration coverage against the
      # just-built exe (both arches), then the upgrade E2E (previous release
      # -> this build, x64 only). Both must pass before anything is uploaded
      # (no continue-on-error).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: pip install -r repo/tests/requirements.txt

      - name: Run settings migration tests
        shell: pwsh
        env:
          AGENTREDACTOR_EXE: ${{ github.workspace }}/repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }}/Release/AgentRedactor.exe
        run: python -m pytest repo/tests/migration/test_settings_migration.py -v

      # Grab the previous published release's x64 Setup.exe for the upgrade
      # E2E. x64 leg only. The glob is arch-explicit: releases published after
      # ARM64 support carry BOTH AgentRedactor-win-Setup.exe and
      # AgentRedactor-win-arm64-Setup.exe, and a plain *-Setup.exe glob would
      # match both (and could pick the ARM64 one).
      # The very first self-release has no predecessor — skip gracefully with
      # a warning in that case.
      - name: Download previous release Setup.exe (x64)
        id: prevsetup
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $currentTag = "v$($env:EXPECTED_VERSION.Trim().TrimStart('v', 'V'))"
          $releases = gh release list --limit 50 --json tagName,isDraft | ConvertFrom-Json
          $prevTag = $null
          foreach ($r in @($releases)) {
            if ($r.isDraft -or $r.tagName -eq $currentTag) { continue }
            $assets = @(gh release view $r.tagName --json assets --jq '.assets[].name')
            if ($assets | Where-Object { $_ -match '-win-Setup\.exe$' }) {
              $prevTag = $r.tagName
              break
            }
          }
          if (-not $prevTag) {
            Write-Host "::warning::No previous release with a *-win-Setup.exe asset found; skipping upgrade E2E (expected for the first self-release)."
            echo "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Previous release with x64 Setup asset: $prevTag"
          gh release download $prevTag --pattern "*-win-Setup.exe" --dir prev-setup --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download $prevTag failed" }
          $setup = (Get-ChildItem prev-setup -Filter "*-win-Setup.exe" | Select-Object -First 1).FullName
          if (-not $setup) { throw "No *-win-Setup.exe found after downloading $prevTag" }
          echo "found=true" >> $env:GITHUB_OUTPUT
          echo "setup_path=$setup" >> $env:GITHUB_OUTPUT

      - name: Upgrade E2E (previous release -> this build)
        if: matrix.arch == 'x64' && steps.prevsetup.outputs.found == 'true'
        shell: pwsh
        env:
          AGENTREDACTOR_UPGRADE_TEST: "1"
          AGENTREDACTOR_PREV_SETUP: ${{ steps.prevsetup.outputs.setup_path }}
          AGENTREDACTOR_FEED_DIR: ${{ github.workspace }}/repo/AgentRedactor/build/velopack
          AGENTREDACTOR_EXPECT_VERSION: ${{ env.EXPECTED_VERSION }}
        run: python -m pytest repo/tests/migration/test_selfrelease_upgrade.py -v

      # Keep the raw Velopack output around per arch — the publish job below
      # downloads both, and they help debug failed/odd releases.
      - name: Upload Velopack output artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRedactor-velopack-${{ env.EXPECTED_VERSION }}-${{ matrix.arch }}
          path: repo/AgentRedactor/build/${{ matrix.arch == 'x64' && 'velopack' || 'velopack-arm64' }}
          retention-days: 30

  # Publish is deliberately OUT of the matrix: both arch legs must pass first,
  # then ONE job uploads both channels to R2 (bucket agentredactor-releases,
  # key prefix <channel>/). R2 is the ONLY update source — the api worker
  # serves /updates straight from the bucket, no GitHub fallback.
  # vpk upload s3 defaults to path-style URLs, which R2 expects; --region
  # auto is the conventional value for R2's S3-compatible endpoint.
  publish:
    needs: release
    runs-on: windows-latest
    # Tag pushes always publish; manual dispatches only when publish is checked.
    if: github.event_name == 'push' || inputs.publish
    env:
      EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      # EXPECTED_VERSION is github.ref_name on tag pushes, i.e. it already
      # carries the leading "v" (v1.2.3); dispatch inputs do not. Normalize
      # once so --tag doesn't become "vv1.2.3".
      - name: Normalize version
        id: ver
        shell: pwsh
        run: echo "version=$($env:EXPECTED_VERSION.Trim().TrimStart('v','V'))" >> $env:GITHUB_OUTPUT

      - name: Download Velopack outputs (both arches)
        uses: actions/download-artifact@v4
        with:
          pattern: AgentRedactor-velopack-${{ env.EXPECTED_VERSION }}-*
          path: velopack
      # Lands in velopack/AgentRedactor-velopack-<ver>-x64 and ...-arm64.

      - name: Install vpk (Velopack CLI)
        shell: pwsh
        run: dotnet tool install -g vpk

      # Publishes the win-channel assets (releases.win.json + nupkg/Setup.exe)
      # to R2 so installed x64 instances can auto-update.
      - name: Publish x64 channel to R2
        shell: pwsh
        run: vpk upload s3 --bucket agentredactor-releases --endpoint https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com --region auto --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} --prefix win --outputDir "velopack/AgentRedactor-velopack-${{ env.EXPECTED_VERSION }}-x64"

      # Same for the win-arm64 channel (prefix win-arm64/).
      - name: Publish ARM64 channel to R2
        shell: pwsh
        run: vpk upload s3 --bucket agentredactor-releases --endpoint https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com --region auto --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -c win-arm64 --prefix win-arm64 --outputDir "velopack/AgentRedactor-velopack-${{ env.EXPECTED_VERSION }}-arm64"

      # vpk uploads everything in the output dir, including files no client
      # ever downloads (the Portable.zip, the legacy Squirrel RELEASES file
      # and vpk's assets.*.json upload manifest). Delete them so the bucket
      # holds only what clients use: releases.*.json, *-full/-delta.nupkg and
      # *-Setup.exe. aws cli is preinstalled on windows-latest.
      - name: Remove non-client files from R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $endpoint = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          foreach ($channel in @('win', 'win-arm64')) {
            aws s3 rm "s3://agentredactor-releases/$channel/" --endpoint-url $endpoint --region auto --recursive --exclude "*" --include "*-Portable.zip" --include "RELEASES" --include "assets.*.json"
          }
