[pytest]
markers =
    upgrade: opt-in Velopack self-release upgrade E2E (requires AGENTREDACTOR_UPGRADE_TEST=1 plus feed/setup env vars; see tests/migration/README.md)
    install: opt-in Velopack self-release fresh-install E2E (requires AGENTREDACTOR_INSTALL_TEST=1 plus setup env vars; see tests/migration/README.md)
    atspi: Linux GUI tests driven through AT-SPI accessibility (need a display — real X session or Xvfb — plus the gi/Atspi bindings; skip cleanly otherwise)
